document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

= SIDEBAR (unchanged) ===================== -->\n  <aside style=\"width:248px; flex:none; height:100%; background:#ffffff; border-right:1px solid #eef0f3; display:flex; flex-direction:column;\">\n\n    <!-- logo -->\n    <div style=\"display:flex; align-items:center; gap:10px; padding:20px 22px 14px;\">\n      <div style=\"width:30px; height:30px; border-radius:8px; background:#2563eb; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(37,99,235,.35);\">\n        <span style=\"color:#fff; font-weight:700; font-size:17px; font-style:italic;\">S<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:20px; font-weight:700; color:#1e2a44; letter-spacing:-.01em;\">Salesflow<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- profile card -->\n    <div style=\"position:relative; padding:8px 18px 18px; text-align:center; border-bottom:1px solid #f3f4f7;\">\n      <div style=\"position:absolute; top:10px; right:18px; color:#aeb6c2; display:flex;\">{{ peopleIcon }}<\u002Fdiv>\n      <div style=\"width:62px; height:62px; border-radius:50%; margin:4px auto 0; background:#e7ecf3; border:2px solid #2bb673; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n        <span style=\"font-size:21px; font-weight:600; color:#5b6b80;\">SB<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:inline-flex; align-items:center; gap:5px; margin-top:-9px; position:relative; background:#e7f7ef; color:#1f9d5c; font-size:11px; font-weight:600; padding:2px 10px; border-radius:999px;\">\n        <span style=\"width:6px; height:6px; border-radius:50%; background:#1f9d5c; display:inline-block;\"><\u002Fspan>Active\n      <\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:700; color:#1e2a44; margin-top:10px;\">Stefan Brakus<\u002Fdiv>\n      <div style=\"font-size:11.5px; color:#8a93a2; margin-top:3px;\">IT Business Analyst – IT Company<\u002Fdiv>\n      <div style=\"font-size:11.5px; color:#8a93a2; margin-top:1px;\">stefan.brakus@ r:1, sev:'warning', cat:'system', type:'refresh', title:'CRM sync failed', context:'HubSpot sync failed 3 hours ago. Some replies may not be logged.', time:'11h', page:'Integrations'},\n      // ---- TIER 2: RECENT ACTIVITY ----\n      {id:'t1', tier:2, group:'today', cat:'replies', type:'reply', hot:true, title:'Ethel Kelly replied', context:'Business development \\u00b7 \\u201cYes, let\\u2019s book a call next week.\\u201d', time:'10:42 PM', page:'Inbox', unread:true},\n      {id:'t2', tier:2, group:'today', cat:'campaigns', type:'ucheck', title:'Marcus Lin accepted your invite', context:'Maserati limited edition', time:'9:15 PM', page:'Campaign', unread:true},\n      {id:'t3', tier:2, group:'today', cat:'campaigns', type:'check', title:'Campaign finished', context:'Business development reached its goal \\u2014 180/180 messages sent.', time:'4:03 PM', page:'Campaign', unread:true},\n      {id:'t4', tier:2, group:'yesterday', cat:'replies', type:'reply', title:'James Porter replied', context:'Q3 Outreach \\u00b7 \\u201cCan you send over pricing?\\u201d', time:'Yesterday 6:20 PM', page:'Inbox', unread:false},\n      {id:'t5', tier:2, group:'yesterday', cat:'campaigns', type:'play', title:'Campaign resumed', context:'Maserati limited edition is active again.', time:'Yesterday 2:11 PM', page:'Campaign', unread:false},\n      {id:'t6', tier:2, group:'yesterday', cat:'campaigns', type:'down', title:'Import completed', context:'412 contacts imported into Q3 Outreach.', time:'Yesterday 11:30 AM', page:'Campaigns', unread:false},\n      {id:'t7', tier:2, group:'earlier', cat:'replies', type:'reply', hot:true, title:'Sofia Almeida replied', context:'Maserati limited edition \\u00b7 \\u201cVery interested, tell me more.\\u201d', time:'Mon 3:48 PM', page:'Inbox', unread:false},\n      {id:'t8', tier:2, group:'earlier', cat:'campaigns', type:'ucheck', title:'Daniel Weber accepted your invite', context:'English lessons club', time:'Mon 10:02 AM', page:'Campaign', unread:false},\n      {id:'t9', tier:2, group:'earlier', cat:'campaigns', type:'play', title:'Campaign started', context:'English lessons club intermediate level is now sending.', time:'Sun 8:00 AM', page:'Campaign', unread:false}\n    ];\n  }\n\n  isUnread(item){\n    if(item.tier===1) return !this.state.resolvedIds[item.id];\n    return !this.state.readIds[item.id] && item.unread;\n  }\n  matches(item, f){\n    if(f==='all') return true;\n    if(f==='attention') return item.tier===1;\n    return item.cat===f;\n  }\n\n  tint(item){\n    if(item.tier===1) return {bg:'#f1f4f8', fg:'#3a4658'};\n    if(item.cat==='replies') return {bg:'#eef3ff', fg:this.accent};\n    if(item.type==='down') return {bg:'#f1f4f8', fg:'#3a4658'};\n    return {bg:'#e9f8ef', fg:'#1f9d5c'};\n  }\n\n  leadEl(item){\n    const t = this.tint(item);\n    return React.createElement('div', {style:{width:40,height:40,borderRadius:10,background:t.bg,color:t.fg,display:'flex',alignItems:'center',justifyContent:'center'}}, this.icon(item.type,20,'currentColor'));\n  }\n\n  sevEl(item){\n    if(item.sev==='critical') return this.tag('#fef3f2','#b42318','Critical','alert');\n    if(item.sev==='warning') return this.tag('#fff8eb','#b54708','Warning','warn');\n    return null;\n  }\n  hotEl(item){\n    if(!item.hot) return null;\n    return this.tag('#fff4ed','#c4320a','Hot lead','flame');\n  }\n  tag(bg,fg,label,ic){\n    return React.createElement('span', {style:{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 9px',borderRadius:6,background:bg,color:fg,fontSize:10.5,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',whiteSpace:'nowrap'}}, this.icon(ic,12,'currentColor'), label);\n  }\n\n  actionBtn(label, onClick){\n    return React.createElement('button', {onClick, style:{display:'inline-flex',alignItems:'center',gap:5,background:'none',border:'none',cursor:'pointer',color:this.accent,fontSize:12.5,fontWeight:600,padding:0,whiteSpace:'nowrap'}}, this.icon('checksm',14,'currentColor'), label);\n  }\n\n  rightEl(item){\n    const unread = this.isUnread(item);\n    const hovered = this.state.hoverId===item.id;\n    let mid;\n    if(hovered && item.tier===1){\n      mid = this.actionBtn('Resolve', (e)=>{ e.stopPropagation(); this.resolve(item.id); });\n    } else if(hovered && item.tier===2 && unread){\n      mid = this.actionBtn('Mark as read', (e)=>{ e.stopPropagation(); this.markRead(item.id); });\n    } else {\n      mid = React.createElement('span', {style:{fontSize:12,color:'#98a2b3',whiteSpace:'nowrap'}}, item.time);\n    }\n    const dot = unread ? React.createElement('span',{style:{width:8,height:8,borderRadius:'50%',background:this.accent,flex:'none'}}) : null;\n    const chev = React.createElement('span',{style:{color:'#c4ccd6',display:'flex'}}, this.icon('chevR',18,'currentColor'));\n    return React.createElement('div', {style:{display:'flex',alignItems:'center',gap:12}}, mid, dot, chev);\n  }\n\n  countEl(n, active){\n    if(!n) return null;\n    return React.createElement('span', {style:{minWidth:18,height:18,padding:'0 5px',borderRadius:9,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,background:active?'rgba(255,255,255,.25)':'#eef0f3',color:active?'#fff':'#667085'}}, String(n));\n  }\n\n  // ---- actions ----\n  resolve(id){ this.setState(s=>({resolvedIds:{...s.resolvedIds,[id]:true}, hoverId:null})); }\n  markRead(id){ this.setState(s=>({readIds:{...s.readIds,[id]:true}, hoverId:null})); }\n  markAll(){ const r={}; this.all().forEach(i=>{ if(i.tier===2) r[i.id]=true; }); this.setState({readIds:r}); }\n  restore(){ this.setState({resolvedIds:{}, readIds:{}}); }\n  setFilter(f){ this.setState({filter:f}); }\n  open(item){ clearTimeout(this._t); this.setState({toast:'Opening '+item.page}); this._t=setTimeout(()=>this.setState({toast:null}),1700); }\n  componentWillUnmount(){ clearTimeout(this._t); }\n\n  decorate(item){\n    const unread = this.isUnread(item);\n    return Object.assign({}, item, {\n      leadEl:this.leadEl(item),\n      sevEl:this.sevEl(item),\n      hotEl:this.hotEl(item),\n      rightEl:this.rightEl(item),\n      titleWeight: unread?600:500,\n      titleColor: unread?'#101828':'#475467',\n      onEnter:()=>this.setState({hoverId:item.id}),\n      onClick:()=>this.open(item)\n    });\n  }\n\n  renderVals(){\n    const f = this.state.filter;\n    const data = this.all().filter(i=>!this.state.resolvedIds[i.id]);\n\n    // tier 1\n    const attRaw = data.filter(i=>i.tier===1 && this.matches(i,f));\n    const attentionItems = attRaw.map(i=>this.decorate(i));\n    const hasAttention = attentionItems.length>0;\n    const showAllClear = !hasAttention && (f==='all' || f==='attention');\n    const showAttentionSection = hasAttention || showAllClear;\n\n    // tier 2 groups\n    const order = [['today','Today'],['yesterday','Yesterday'],['earlier','Earlier']];\n    const recentGroups = order.map(([k,label])=>({\n      label,\n      items: data.filter(i=>i.tier===2 && i.group===k && this.matches(i,f)).map(i=>this.decorate(i))\n    })).filter(g=>g.items.length>0);\n    const showRecent = recentGroups.length>0;\n\n    // counts\n    const cnt = (fil)=> this.all().filter(i=>!this.state.resolvedIds[i.id] && this.matches(i,fil) && this.isUnread(i)).length;\n    const unreadCount = cnt('all');\n    const attentionCount = this.all().filter(i=>i.tier===1 && !this.state.resolvedIds[i.id] && this.matches(i,f)).length;\n\n    const chipDefs = [['all','All'],['attention','Needs attention'],['replies','Replies'],['campaigns','Campaigns'],['system','System']];\n    const chips = chipDefs.map(([id,label])=>{\n      const active = f===id;\n      const n = id==='attention' ? this.all().filter(i=>i.tier===1 && !this.state.resolvedIds[i.id]).length : cnt(id);\n      return {\n        label, active,\n        bg: active? this.accent : '#ffffff',\n        color: active? '#ffffff' : '#475467',\n        border: active? this.accent : '#e5e7eb',\n        countEl: this.countEl(n, active),\n        onClick:()=>this.setFilter(id)\n      };\n    });\n\n    // sidebar nav\n    const navDefs = [\n      ['home','Home',false,true],['bar','Dashboard',false,false],['grid','Campaigns',false,false],\n      ['msgsq','Templates',true,false],['inbox','Inbox',false,false],['branch','Integrations',true,false],\n      ['gear','Settings',true,false],['userx','Blacklists',false,false],['help','Help',false,false],['share','Affiliate Program',false,false]\n    ];\n    const navItems = navDefs.map(([ic,label,caret,active])=>({\n      label,\n      iconEl: this.icon(ic, 19, active?this.accent:'#6b7585'),\n      caretEl: caret? this.icon('caret',16,'#b8c0cc') : null,\n      color: active? this.accent : '#475467',\n      bg: active? '#eef4ff' : 'transparent',\n      weight: active? 600 : 500,\n      onClick:()=>{ if(!active){ clearTimeout(this._t); this.setState({toast:'Opening '+label}); this._t=setTimeout(()=>this.setState({toast:null}),1700); } }\n    }));\n\n    return {\n      accent:this.accent,\n      rowPad: (this.props.density==='compact') ? '11px 18px' : '15px 18px',\n      navItems,\n      peopleIcon:this.icon('peopleSmall',18,'currentColor'),\n      powerIcon:this.icon('power',18,'currentColor'),\n      caretIcon:this.icon('caret',18,'currentColor'),\n      allClearIcon:this.icon('allclear',28,'currentColor'),\n      toastIcon:this.icon('chevR',16,'currentColor'),\n      unreadCount, hasUnread: unreadCount>0,\n      attentionCount,\n      markAll:()=>this.markAll(),\n      restore:()=>this.restore(),\n      leaveRow:()=>this.setState({hoverId:null}),\n      logout:()=>{},\n      chips,\n      attentionItems, hasAttention, showAllClear, showAttentionSection,\n      recentGroups, showRecent,\n      showToast: !!this.state.toast,\n      toastText: this.state.toast || ''\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
